[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatsense-backend"
version = "0.1.0"
description = "THREAT-SENSE AI — multi-layered cybersecurity threat detection platform"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Pydantic & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",      # SQLite async driver (dev)
    # HTTP
    "httpx>=0.27.0",
    # Input / normalizers (Stage 2)
    "tldextract>=5.1.0",      # TLD/domain extraction for URLs
    "Pillow>=10.3.0",         # Image validation (Stage 2, OCR Stage 8)
    "aiofiles>=24.1.0",       # Async file I/O for uploads
    "beautifulsoup4>=4.12.0", # HTML parsing (emails, Stage 6)
    "html2text>=2024.2.26",   # HTML→text for email bodies
    # URL Engine / Domain 2 (Stage 3)
    "rapidfuzz>=3.6.0",       # Brand similarity (ratio, partial, token-set)
    "scikit-learn>=1.5.0",    # Model calibration, StandardScaler
    "xgboost>=2.0.0",         # Primary URL classifier
    "shap>=0.45.0",           # Feature explanations
    "joblib>=1.4.0",          # Model serialization
    # Media Engine (Stage 8)
    "pyzbar>=0.1.9",          # QR code decoding
    "pytesseract>=0.3.10",    # OCR for screenshots
    # Security / API
    "slowapi>=0.1.9",         # Rate limiting
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",          # httpx mock for SSRF redirect tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "RUF"]
ignore = [
    "E501",    # line too long — handled by formatter
    "B008",    # function calls in default args — FastAPI DI pattern
    "RUF012",  # mutable class attributes — intentional for detector metadata
    "N805",    # first arg of method — pydantic validators
    "UP007",   # Use X | Y instead of Optional[X] — we target 3.11 but keep compat style
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
