# Brand → legitimate domains map for D11 (Brand Impersonation) and D14 (IDN/Homograph).
#
# Format:
#   brand_key:        Lowercase brand name used internally
#   display_name:     Human-readable name shown in evidence
#   domains:          List of ALL legitimate domains for this brand (including subdomains like login.*)
#   aliases:          Optional alternate names/spellings to match against URL text
#   india_priority:   true = prioritise in scoring for Indian-context deployments
#
# Editing policy:
#   - Add new brands in alphabetical order within each section.
#   - Never remove a brand; mark inactive ones with `active: false`.
#   - Bump the version string when the file changes.
#
# Version: 1.0.0

version: "1.0.0"

brands:

  # ── Global Financial ─────────────────────────────────────────────────────────

  - brand_key: amazon
    display_name: Amazon
    domains: [amazon.com, amazon.in, amazon.co.uk, amazon.de, amazon.fr,
              amazon.co.jp, amazonpay.in, pay.amazon.com, signin.aws.amazon.com]
    aliases: [amzn, amzon]

  - brand_key: apple
    display_name: Apple
    domains: [apple.com, icloud.com, appleid.apple.com, itunes.apple.com,
              support.apple.com, iforgot.apple.com]
    aliases: [appie, aple]

  - brand_key: ebay
    display_name: eBay
    domains: [ebay.com, ebay.co.uk, ebay.in, ebay.com.au, signin.ebay.com]
    aliases: [e-bay, ebays]

  - brand_key: facebook
