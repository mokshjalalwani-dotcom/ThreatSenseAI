              mail.google.com, gmail.com, drive.google.com, play.google.com,
              myaccount.google.com, pay.google.com, google.com.au]
    aliases: [g00gle, gooogle, googIe]

  - brand_key: instagram
    display_name: Instagram
    domains: [instagram.com, www.instagram.com]
    aliases: [instagramm, instagran, instagrarn]

  - brand_key: linkedin
    display_name: LinkedIn
    domains: [linkedin.com, www.linkedin.com, lnkd.in]
    aliases: [linkedln, linkdin]

  - brand_key: microsoft
    display_name: Microsoft
    domains: [microsoft.com, live.com, hotmail.com, outlook.com, office.com,
              office365.com, microsoftonline.com, login.microsoftonline.com,
              login.live.com, account.microsoft.com, onmicrosoft.com,
              sharepoint.com, teams.microsoft.com, azure.com, windowsazure.com]
    aliases: [mircrosoft, micros0ft, m1crosoft]

  - brand_key: netflix
    display_name: Netflix
    domains: [netflix.com, www.netflix.com, help.netflix.com]
    aliases: [netfl1x, netf1ix, netflex]

  - brand_key: paypal
