[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template for new migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
version_path_separator = os   # Use os.pathsep on Windows/Linux

# NOTE: sqlalchemy.url is NOT set here; it is injected dynamically from the
# DATABASE_URL environment variable inside alembic/env.py so that the same
# alembic.ini works across SQLite (dev) and PostgreSQL (prod).

[post_write_hooks]
# Uncomment to auto-format new migration files with ruff
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
