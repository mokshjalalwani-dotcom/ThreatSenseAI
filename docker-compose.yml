version: "3.9"

# ── THREAT-SENSE AI — Docker Compose ─────────────────────────────────────────
# Services:
#   api      — FastAPI backend (always on)
#   postgres — PostgreSQL 15 (always on)
#   redis    — Redis 7 (optional; start with: docker compose --profile redis up)
#
# Quick start:
#   1. cp .env.example .env   (edit secrets)
#   2. docker compose up --build
#   3. open http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatsense-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://threatsense:threatsense@postgres:5432/threatsense}
      NLP_BACKEND: ${NLP_BACKEND:-rules}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      PHISHTANK_API_KEY: ${PHISHTANK_API_KEY:-}
      SEND_URLS_TO_THIRD_PARTIES: ${SEND_URLS_TO_THIRD_PARTIES:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Hot-reload the app code without rebuilding (dev only)
      - ./backend/app:/app/app:ro
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: threatsense-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatsense}
      POSTGRES_DB: ${POSTGRES_DB:-threatsense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatsense} -d ${POSTGRES_DB:-threatsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (optional) ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: threatsense-redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    profiles:
      - redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
